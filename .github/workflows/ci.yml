name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.8
          install-mode: goinstall

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"
      - run: go build ./...
      - run: go vet ./...
      - name: Test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          fail_ci_if_error: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Frontend type-check
        run: cd web && npm ci && npx tsc -b --noEmit

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26.x"
          go-package: ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin/amd64, darwin/arm64, windows/amd64, windows/arm64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Build and vet for ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go build ./...
          go vet ./...

  store-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Test store with coverage
        run: go test -coverprofile=coverage-store.out -covermode=atomic ./store/...
        env:
          ARTEX_TEST_PG: "postgres://artex:artex@localhost:5432/artex_test?sslmode=disable"
      - name: Upload store coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-store.out
          flags: store
          fail_ci_if_error: false
